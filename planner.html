<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배치 플래너 | 드레스룸 스토어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#F3EDE5;--sheet:#FBF8F3;--ink:#2F231B;--ink2:#6E6157;--rule:#DDD2C4;--grid:#ECE4D9;--room:#FFFFFF;
--accent:#1F5FD1;--accent-soft:rgba(31,95,209,.10);--warn:#C8372D;--warn-soft:rgba(200,55,45,.12);
font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16171A;--sheet:#1F2125;--ink:#E7E8E6;--ink2:#A3A7AC;--rule:#3A3D43;--grid:#2A2D32;--room:#24272C;--accent:#79A3F2;--accent-soft:rgba(121,163,242,.14);--warn:#F0776C;--warn-soft:rgba(240,119,108,.16)}}
:root[data-theme="dark"]{--paper:#16171A;--sheet:#1F2125;--ink:#E7E8E6;--ink2:#A3A7AC;--rule:#3A3D43;--grid:#2A2D32;--room:#24272C;--accent:#79A3F2;--accent-soft:rgba(121,163,242,.14);--warn:#F0776C;--warn-soft:rgba(240,119,108,.16)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:hidden;max-width:100vw}
#three canvas{display:block;width:100%!important;height:100%!important}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.top-l{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0;white-space:nowrap}
.top p{margin:0;color:var(--ink2);font-size:13px}
.tools{display:flex;gap:8px}
.bar{background:var(--sheet);border-bottom:1px solid var(--rule);padding:0 20px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 0}
.bar-row+.bar-row{border-top:1px dashed var(--rule)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.grp.grow{flex:1 1 320px}
.grp>b{font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.n{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.sep{width:1px;align-self:stretch;background:var(--rule)}
.lbl{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.inl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2)}
.inl input{font:inherit;font-size:15px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:5px 8px;width:84px}
.err{color:var(--warn);font-size:12.5px}
.err:empty{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{display:flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;padding:4px 9px 4px 5px;border:1px solid var(--rule);border-radius:20px;background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:block}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;flex:1 1 220px;min-width:0;max-width:560px}
#catalog{flex:1 1 600px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;min-width:0}
.cat{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--room)}
.cat-img{height:118px;display:flex;align-items:center;justify-content:center;background:var(--sheet);border-radius:4px;overflow:hidden}
.cat-img img{width:100%;height:100%;object-fit:contain;display:block}
.cat-img svg{width:40px;height:60px}
.cat b{font-weight:600;font-size:13px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat small{display:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.check{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px 20px 24px}
.views{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;min-width:0}
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:13px;font-weight:600;flex-wrap:wrap}
.pane-h span{font-weight:400;color:var(--ink2);font-size:12.5px}
#plan,#three{height:clamp(380px,calc(100vh - 400px),760px)}
#plan{width:100%;display:block;touch-action:none;background:var(--paper);user-select:none}
#three{touch-action:none;cursor:grab;background:var(--paper);position:relative}
.below{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
h3{font-size:13.5px;font-weight:600;margin:0 0 10px}
.muted{color:var(--ink2);font-size:13px}
.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:5px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
.field input{font:inherit;font-size:15px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
.parts{list-style:none;margin:0;padding:0}
.parts li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.parts li:last-child{border-bottom:0}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.status{font-size:12.5px;margin-top:8px}
.status.bad{color:var(--warn)}
.status.ok{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:13px;padding:8px 14px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px}
[hidden]{display:none!important}
.brand{font-weight:600;font-size:15px;text-decoration:none;color:var(--ink2);white-space:nowrap}
.tools a.btn{text-decoration:none}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;margin-left:2px}
.cart-cta{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.admin{background:var(--sheet);border-bottom:1px solid var(--rule);padding:14px 20px}
.admin-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.admin-h h3{margin:0;font-size:15px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--rule);border-radius:5px;padding:6px 10px;background:var(--room);font-size:13px}
.prow input{width:112px;text-align:right;font:inherit;font-size:15px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 6px}
.prow input[aria-invalid="true"]{border-color:var(--warn)}
.admin-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}
.admin-f .err{margin-right:auto}
.adm-sec{border-top:1px dashed var(--rule);padding:8px 0}
.adm-sec>summary{cursor:pointer;font-size:14px;font-weight:600;padding:4px 0;margin-bottom:6px}
.set-list{max-height:min(380px,40vh)}
.set-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto;padding-right:2px}
.srow{display:grid;grid-template-columns:110px 150px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:5px;padding:6px 8px;background:var(--room);font-size:13px}
.srow input{font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 6px;width:100%;min-width:0}
.srow input[aria-invalid="true"]{border-color:var(--warn)}
.srow .sum{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.srow .acts .btn{padding:4px 8px;font-size:12px}
@media (max-width:1400px){main{grid-template-columns:minmax(0,1fr)}.below{display:grid;grid-template-columns:1fr 1fr}#plan,#three{height:clamp(380px,calc(100vh - 380px),640px)}}
@media (max-width:1100px){.views{grid-template-columns:minmax(0,1fr)}.sep{display:none}}
@media (max-width:820px){.srow{grid-template-columns:1fr 1fr}.srow .sum,.srow .acts{grid-column:1/-1}.srow .acts{justify-content:flex-start}.top{padding:12px 16px}.top p{display:none}h1{font-size:19px}.bar{padding:0 14px}.grp,.grp.grow{flex:1 1 100%}
 main{padding:12px 12px 24px}.below{grid-template-columns:1fr}#plan{height:62vw;min-height:280px;max-height:420px}#three{height:70vw;min-height:300px;max-height:440px}
 .inl input,select{font-size:16px}.field input{font-size:16px}.cat small{display:block;color:var(--ink2);font-size:11.5px}#catalog{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-l">
    <a class="brand" href="/" id="brand">드레스룸 스토어</a>
    <h1>배치 플래너</h1>
  </div>
  <nav class="tools" aria-label="플래너 도구">
    <a class="btn" href="/#sets">추천 세트</a>
    <a class="btn" href="/cart">장바구니 <b class="cnt" data-cart-count hidden>0</b></a>
    <button class="btn" id="undoBtn" title="Ctrl+Z">되돌리기</button>
    <button class="btn" id="adminBtn" hidden>관리자 설정</button>
    <button class="btn danger" id="clearBtn">모두 지우기</button>
  </nav>
</header>

<div class="bar">
  <div class="bar-row">
    <div class="grp">
      <b><span class="n">1</span>방 크기</b>
      <label class="inl">가로<input id="roomW" type="number" inputmode="decimal" min="50" max="2000" step="0.1" aria-label="방 가로 cm"></label>
      <label class="inl">세로<input id="roomD" type="number" inputmode="decimal" min="50" max="2000" step="0.1" aria-label="방 세로 cm"></label>
      <span class="lbl">cm</span>
      <button class="btn primary" id="roomApply">적용</button>
      <span class="err" id="roomErr" role="alert"></span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <b><span class="n">2</span>색상</b>
      <span class="lbl">프레임</span><div class="swatches" id="pillarSw"></div>
      <span class="lbl">선반</span><div class="swatches" id="shelfSw"></div>
    </div>
    <span class="sep"></span>
    <div class="grp grow">
      <b>세트</b>
      <select id="setSel" aria-label="세트 선택"></select>
      <button class="btn" id="setBtn" title="현재 배치를 세트로 바꿔요. 코너 세트는 왼쪽 벽까지 이어져요.">세트로 배치</button>
    </div>
  </div>
  <div class="bar-row">
    <div class="grp"><b><span class="n">3</span>모듈 추가</b></div>
    <div id="catalog"></div>
    <label class="check"><input type="checkbox" id="autoRot" checked> 벽에 끌면 자동 회전</label>
  </div>
</div>

<section class="admin" id="adminPanel" hidden aria-labelledby="adminTitle">
  <div class="admin-h"><h3 id="adminTitle">관리자 설정</h3><span class="muted" id="adminNote"></span></div>
  <details class="adm-sec" id="secPrice" open>
    <summary>단가 변경</summary>
    <div class="admin-grid" id="priceRows"></div>
    <div class="admin-f" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="adminReset">기본 단가로</button></div>
  </details>
  <details class="adm-sec" id="secSet" open>
    <summary>세트 설정 (변경, 추가) <span class="muted" id="setCount"></span></summary>
    <p class="muted" style="margin:0 0 8px">평면도에 모듈을 배치한 뒤 '현재 배치로 새 세트'를 누르면 세트로 만들어져요. 배치 보기로 불러와 고친 뒤 '현재 배치로 바꾸기'로 수정할 수 있어요.</p>
    <div id="setRows" class="set-list"></div>
    <div class="admin-f" style="justify-content:flex-start;margin-top:8px">
      <button class="btn" id="setNew">현재 배치로 새 세트</button>
      <button class="btn" id="setDefaults">기본 세트로</button>
    </div>
  </details>
  <div class="admin-f">
    <span class="err" id="adminErr" role="alert"></span>
    <button class="btn" id="adminCopy" hidden>JSON 복사</button>
    <button class="btn" id="adminClose">닫기</button>
    <button class="btn primary" id="adminSave">저장</button>
  </div>
</section>

<main>
  <div class="views">
    <div class="pane">
      <div class="pane-h">평면도<span>끌어서 이동, <kbd>R</kbd> 회전, <kbd>Del</kbd> 삭제</span></div>
      <svg id="plan" role="img" aria-label="방 평면도와 배치된 모듈"><g id="planG"></g></svg>
    </div>
    <div class="pane">
      <div class="pane-h">3D 미리보기<span style="display:flex;gap:8px;align-items:center">3D에서도 끌 수 있어요 <button class="btn" id="camReset" style="padding:3px 9px;font-size:12px">시점 초기화</button></span></div>
      <div id="three"></div>
    </div>
  </div>
  <div class="below">
    <div class="card" id="selPanel"></div>
    <div class="card"><h3>구성 목록</h3><div id="parts"></div></div>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/js/catalog.js"></script><script src="/js/shop-config.js"></script><script src="/js/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/model3d.js"></script>
<script>
(function(){
const MOD_H=2000, WALL_H=2400, KEY='dressroom-planner-v1';
const {DEPTH,EXTRA,CORNER,PILLAR,SHELF,TYPES,DEFAULT_PRICES:DEFAULT_PRICE}=window.DR_CATALOG;
const PRICE=Object.assign({},DEFAULT_PRICE);
const won=n=>n.toLocaleString('ko-KR')+'원';
const HANGERS=['hang2','hang1','hangShelf','drawer3'];
const modLen=([t,w])=>t==='corner'?CORNER:w+EXTRA;
const DEFAULT_SETS=window.DR_CATALOG.DEFAULT_SETS;
function validSet(st){return st&&typeof st.k==='string'&&st.k.trim()&&typeof st.g==='string'&&st.g.trim()&&(st.ax==='l'||st.ax==='r')&&(st.ay==='t'||st.ay==='b')&&Array.isArray(st.items)&&st.items.length>0&&
  st.items.every(m=>m&&TYPES[m.t]&&(m.t==='corner'||TYPES[m.t].widths.includes(m.w))&&[0,90,180,270].includes(m.r)&&isFinite(m.x)&&isFinite(m.y))}
let SETS=DEFAULT_SETS;
const fpM=m=>m.t==='corner'?{w:CORNER,h:CORNER}:(m.r%180===0?{w:m.w+EXTRA,h:DEPTH}:{w:DEPTH,h:m.w+EXTRA});
function setBox(st){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;st.items.forEach(m=>{const f=fpM(m);x0=Math.min(x0,m.x);y0=Math.min(y0,m.y);x1=Math.max(x1,m.x+f.w);y1=Math.max(y1,m.y+f.h)});return{w:x1-x0,h:y1-y0}}
function setMods(st){return [...st.items].sort((a,b)=>(a.y-b.y)||(a.x-b.x)).map(m=>m.t==='corner'?'코너장':`${m.w} ${TYPES[m.t].name}`).join(' + ')}
function setSize(st){const b=setBox(st);return b.h>DEPTH+1?`${fmt(b.w)} × ${fmt(b.h)}cm`:`${fmt(b.w)}cm`}
function setLabel(st){return `${st.k}: ${setMods(st)} (${setSize(st)})`}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S={room:{w:3000,d:2400},pillar:'black',shelf:'oak',autoRot:true,items:[]};
let sel=null,nextId=1,hist=[],drag=null,guides=null;

const $=id=>document.getElementById(id);
const get=id=>S.items.find(i=>i.id===id);
const fmt=mm=>{const v=Math.round(mm)/10;return (Math.round(v*10)/10).toLocaleString('ko-KR',{maximumFractionDigits:1})};
const nameOf=it=>it.type==='corner'?'코너장':`${it.w} ${TYPES[it.type].name}`;
function fp(it){if(it.type==='corner')return{w:CORNER,h:CORNER};const W=it.w+EXTRA;return it.rot%180===0?{w:W,h:DEPTH}:{w:DEPTH,h:W}}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.room&&Array.isArray(s.items)){S=Object.assign(S,s);nextId=S.items.reduce((m,i)=>Math.max(m,i.id),0)+1}}catch(e){}}
function snapshot(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()}
function undo(){if(!hist.length){toast('되돌릴 작업이 없어요');return}S=JSON.parse(hist.pop());if(sel&&!get(sel))sel=null;syncInputs();applyColors();buildRoom();refreshAll()}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}

function hits(a,b){const fa=fp(a),fb=fp(b);return a.x<b.x+fb.w-1&&a.x+fa.w>b.x+1&&a.y<b.y+fb.h-1&&a.y+fa.h>b.y+1}
function outside(a){const f=fp(a);return a.x<-1||a.y<-1||a.x+f.w>S.room.w+1||a.y+f.h>S.room.d+1}
function bad(a){return outside(a)||S.items.some(o=>o!==a&&hits(a,o))}
function clampIn(it){const f=fp(it);if(f.w<=S.room.w)it.x=Math.min(Math.max(it.x,0),S.room.w-f.w);if(f.h<=S.room.d)it.y=Math.min(Math.max(it.y,0),S.room.d-f.h)}

function findSpot(it){
  const RW=S.room.w,RD=S.room.d;
  if(it.type==='corner'){
    for(const r of [0,90,180,270]){it.rot=r;const f=fp(it);it.x=(r===90||r===180)?RW-f.w:0;it.y=(r===180||r===270)?RD-f.h:0;if(!bad(it))return true}
    it.rot=0;it.x=0;it.y=0;return false;
  }

  return `<svg viewBox="0 0 34 50" aria-hidden="true" style="color:var(--ink2)">${s}</svg>`;
}
$('catalog').innerHTML=Object.entries(TYPES).map(([k,t])=>`<div class="cat" title="${t.desc}"><div class="cat-img" data-img="${k}">${elev(k)}</div><div><b>${t.name}</b><small>${t.desc}</small><div class="chips">${
  k==='corner'?`<button class="chip" data-t="corner" data-w="0" aria-label="코너장 추가">${fmt(CORNER)}×${fmt(CORNER)} 추가</button>`:t.widths.map(w=>`<button class="chip" data-t="${k}" data-w="${w}" aria-label="${w} ${t.name} 추가">${w}</button>`).join('')}</div></div></div>`).join('');
$('catalog').onclick=e=>{const b=e.target.closest('[data-t]');if(b)addModule(b.dataset.t,+b.dataset.w)};
// 모듈 카드 그림을 현재 색상의 3D 이미지로 그립니다 (색을 바꾸면 다시 그림)
let catJob=0;
function renderCatalogImages(){
  if(!window.DRModel3D)return;
  const job=++catJob,els=[...document.querySelectorAll('#catalog [data-img]')];
  const step=()=>{
    if(job!==catJob)return;const el=els.shift();if(!el)return;
    const t=el.dataset.img,w=TYPES[t].widths[0];
    const url=DRModel3D.snapshot([{t,w,r:0,x:0,y:0}],{pillar:S.pillar,shelf:S.shelf,width:300,height:236,angle:t==='corner'?0.75:-0.5,pitch:0.15});
    if(url)el.innerHTML=`<img alt="${TYPES[t].name} 3D 이미지" src="${url}">`;
    setTimeout(step,0);
  };
  step();
}
function renderSetSel(){$('setSel').innerHTML=[...new Set(SETS.map(x=>x.g))].map(g=>`<optgroup label="${esc(g)}">${SETS.map((x,i)=>x.g===g?`<option value="${i}">${esc(setLabel(x))}</option>`:'').join('')}</optgroup>`).join('')}
renderSetSel();
$('setBtn').onclick=()=>placeSet(+$('setSel').value);
$('undoBtn').onclick=undo;
$('clearBtn').onclick=()=>{if(!S.items.length)return;snapshot();S.items=[];sel=null;refreshAll();toast('모두 지웠어요. 되돌리기로 복구할 수 있어요.')};
$('camReset').onclick=resetCam;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Escape'){sel=null;refreshAll();return}
  const it=get(sel);if(!it)return;
  if(e.key==='r'||e.key==='R'){rotateSel();return}
  if(e.key==='d'||e.key==='D'){dupSel();return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return}
  const st=e.shiftKey?100:10,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){e.preventDefault();snapshot();it.x+=mv[0];it.y+=mv[1];refreshAll()}
});

/* ---------- 관리자 설정 (단가, 세트) ---------- */
let adminMode=null,artifactNs=null,adminSets=[];
const priceKeys=()=>Object.entries(TYPES).flatMap(([t,d])=>d.widths.map(w=>[`${t}-${w}`,t==='corner'?'코너장':`${w} ${d.name}`]));
function renderSetRows(){
  $('setCount').textContent=`${adminSets.length}개`;
  $('setRows').innerHTML=adminSets.length?adminSets.map((st,i)=>`<div class="srow" data-i="${i}">
    <input class="sg" value="${esc(st.g)}" aria-label="분류" placeholder="분류(예: 160cm)">
    <input class="sk" value="${esc(st.k)}" aria-label="세트 이름" placeholder="세트 이름">
    <span class="sum" title="${esc(setMods(st))}">${esc(setMods(st))} (${setSize(st)})</span>
    <span class="acts"><button class="btn" data-a="view">배치 보기</button><button class="btn" data-a="replace">현재 배치로 바꾸기</button><button class="btn" data-a="up" aria-label="위로 이동">▲</button><button class="btn" data-a="down" aria-label="아래로 이동">▼</button><button class="btn danger" data-a="del">삭제</button></span>
  </div>`).join(''):'<p class="muted" style="margin:0">세트가 없어요. 평면도에 모듈을 배치하고 현재 배치로 새 세트를 눌러 보세요.</p>';
}
function openAdmin(){
  $('priceRows').innerHTML=priceKeys().map(([k,l])=>`<label class="prow"><span>${l}</span><span><input type="number" inputmode="numeric" min="0" step="100" data-k="${k}" value="${PRICE[k]??''}"> 원</span></label>`).join('');
  adminSets=JSON.parse(JSON.stringify(SETS));renderSetRows();
  $('adminErr').textContent='';$('adminPanel').hidden=false;$('adminPanel').scrollIntoView({block:'nearest'});
}
function readAdmin(){
  const out={};let bad=null;
  $('priceRows').querySelectorAll('input').forEach(inp=>{const v=inp.value.trim(),n=Number(v);
    const ok=v!==''&&Number.isInteger(n)&&n>=0&&n<=100000000;inp.setAttribute('aria-invalid',ok?'false':'true');
    if(ok)out[inp.dataset.k]=n;else if(!bad)bad=inp});
  if(bad){$('adminErr').textContent='단가는 0 이상의 정수(원)로 입력해 주세요.';bad.focus();return null}
  return out;
}
function readSets(){
  const names=new Set();let bad=null,msg='';
  $('setRows').querySelectorAll('.srow').forEach(r=>{const st=adminSets[+r.dataset.i],g=r.querySelector('.sg'),k=r.querySelector('.sk');
    st.g=g.value.trim();st.k=k.value.trim();
    g.setAttribute('aria-invalid',st.g?'false':'true');
    const dup=names.has(st.k);k.setAttribute('aria-invalid',st.k&&!dup?'false':'true');names.add(st.k);
    if(!bad&&!st.g){bad=g;msg='세트 분류를 입력해 주세요.'}
    if(!bad&&!st.k){bad=k;msg='세트 이름을 입력해 주세요.'}
    if(!bad&&dup){bad=k;msg=`세트 이름 '${st.k}'이(가) 겹쳐요. 다른 이름으로 바꿔 주세요.`}});
  if(bad){$('adminErr').textContent=msg;bad.focus();return null}
  return adminSets.map(st=>({g:st.g,k:st.k,ax:st.ax,ay:st.ay,items:st.items}));
}
function layoutReady(){
  if(!S.items.length){$('adminErr').textContent='먼저 평면도에 모듈을 배치해 주세요.';return false}
  if(S.items.some(bad)){$('adminErr').textContent='겹치거나 방 밖에 있는 모듈을 먼저 정리해 주세요.';return false}
  return true;
}
$('setRows').addEventListener('input',e=>{const r=e.target.closest('.srow');if(!r)return;const st=adminSets[+r.dataset.i];
  if(e.target.matches('.sg'))st.g=e.target.value;if(e.target.matches('.sk'))st.k=e.target.value;e.target.setAttribute('aria-invalid','false');$('adminErr').textContent=''});
$('setRows').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.closest('.srow').dataset.i,st=adminSets[i];$('adminErr').textContent='';
  switch(b.dataset.a){
    case 'view':placeSetObj(st);break;
    case 'replace':if(!layoutReady())return;Object.assign(st,layoutToSet());renderSetRows();toast(`${st.k||'세트'}를 현재 배치로 바꿨어요. 저장해야 적용돼요.`);break;
    case 'up':if(i>0){[adminSets[i-1],adminSets[i]]=[adminSets[i],adminSets[i-1]];renderSetRows();$('setRows').querySelectorAll('.srow')[i-1].querySelector('[data-a="up"]').focus()}break;
    case 'down':if(i<adminSets.length-1){[adminSets[i+1],adminSets[i]]=[adminSets[i],adminSets[i+1]];renderSetRows();$('setRows').querySelectorAll('.srow')[i+1].querySelector('[data-a="down"]').focus()}break;
    case 'del':adminSets.splice(i,1);renderSetRows();toast(`${st.k||'세트'}를 목록에서 뺐어요. 저장해야 적용돼요.`);break;
  }});
$('setNew').onclick=()=>{$('adminErr').textContent='';if(!layoutReady())return;
  let n=adminSets.length+1;while(adminSets.some(x=>x.k===`새 세트 ${n}`))n++;
  adminSets.push({g:(adminSets[adminSets.length-1]||{}).g||'내 세트',k:`새 세트 ${n}`,...layoutToSet()});renderSetRows();
  const rows=$('setRows').querySelectorAll('.srow'),inp=rows[rows.length-1].querySelector('.sk');inp.scrollIntoView({block:'nearest'});inp.focus();inp.select();
  toast('현재 배치로 새 세트를 만들었어요. 이름과 분류를 정하고 저장해 주세요.')};
$('setDefaults').onclick=()=>{adminSets=JSON.parse(JSON.stringify(DEFAULT_SETS));renderSetRows();$('adminErr').textContent='';toast('기본 세트로 채웠어요. 저장해야 적용돼요.')};
$('priceRows').addEventListener('input',e=>{if(e.target.matches('input')){e.target.setAttribute('aria-invalid','false');$('adminErr').textContent=''}});
$('adminBtn').onclick=()=>{$('adminPanel').hidden?openAdmin():($('adminPanel').hidden=true)};
$('adminClose').onclick=()=>{$('adminPanel').hidden=true};
$('adminReset').onclick=()=>{$('priceRows').querySelectorAll('input').forEach(i=>{i.value=DEFAULT_PRICE[i.dataset.k]??'';i.setAttribute('aria-invalid','false')});$('adminErr').textContent='';toast('기본 단가로 채웠어요. 저장해야 적용돼요.')};
$('adminCopy').onclick=async()=>{const p=readAdmin();if(!p)return;const st=readSets();if(!st)return;const txt=JSON.stringify({prices:p,sets:st});
  try{await navigator.clipboard.writeText(txt);toast('단가와 세트 JSON을 복사했어요')}catch(e){$('adminErr').textContent='복사하지 못했어요. 브라우저의 클립보드 권한을 확인해 주세요.'}};
let adminPw='';
async function adminApi(body){
  const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':adminPw},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){adminPw='';sessionStorage.removeItem('dr-admin-pw');throw new Error(j.error||'관리자 비밀번호가 맞지 않아요.')}
  if(!r.ok)throw new Error(j.error||'저장하지 못했어요.');return j;
}
$('adminSave').onclick=async()=>{
  const p=readAdmin();if(!p)return;const sets=readSets();if(!sets)return;
  if(!sets.length){$('adminErr').textContent='세트를 하나 이상 남겨 주세요.';return}
  if(!adminPw){const v=prompt('관리자 비밀번호를 입력해 주세요.');if(!v)return;adminPw=v}
  const btn=$('adminSave');btn.disabled=true;btn.textContent='저장 중…';
  try{await adminApi({prices:p,sets});sessionStorage.setItem('dr-admin-pw',adminPw);
    Object.assign(PRICE,p);SETS=sets;renderSetSel();renderParts();toast('저장했어요. 모든 고객에게 바로 적용돼요.')}
  catch(err){$('adminErr').textContent=err.message}
  finally{btn.disabled=false;btn.textContent='저장하고 모두에게 적용'}
};
(function initAdmin(){
  if(!/admin/.test(location.hash))return;
  adminPw=sessionStorage.getItem('dr-admin-pw')||'';adminMode='server';
  $('adminBtn').hidden=false;$('adminSave').textContent='저장하고 모두에게 적용';
  $('adminNote').textContent='저장하면 서버에 기록되어 모든 고객 화면에 바로 적용돼요. 처음 저장할 때 관리자 비밀번호를 물어봐요.';
})();

/* ---------- 쇼핑몰 연동 ---------- */
function layoutPayload(){return{room:{...S.room},pillar:S.pillar,shelf:S.shelf,items:S.items.map(it=>({t:it.type,w:it.w,r:it.rot,x:it.x,y:it.y}))}}
function applyLayout(L){
  if(!L||!L.room||!Array.isArray(L.items))return false;
  const items=L.items.filter(m=>window.DR_CATALOG.validItem(m.t,m.w));
  S.room={w:Math.max(500,Math.min(20000,Math.round(L.room.w)||3000)),d:Math.max(500,Math.min(20000,Math.round(L.room.d)||2400))};
  if(PILLAR[L.pillar])S.pillar=L.pillar;if(SHELF[L.shelf])S.shelf=L.shelf;
  S.items=items.map(m=>({id:nextId++,type:m.t,w:m.w,rot:[0,90,180,270].includes(m.r)?m.r:0,x:Math.round(m.x)||0,y:Math.round(m.y)||0}));
  return true;
}
$('parts').addEventListener('click',async e=>{
  if(e.target.closest('#addCart')){
    if(!S.items.length){toast('먼저 모듈을 배치해 주세요');return}
    if(S.items.some(bad)){toast('겹치거나 방 밖에 있는 모듈을 먼저 정리해 주세요');return}
    const m=new Map();S.items.forEach(it=>{const k=`${it.type}-${it.w}`;m.set(k,(m.get(k)||0)+1)});
    const items=[...m].map(([k,n])=>{const [t,w]=k.split('-');return{t,w:Number(w),n}});
    Shop.cart.add({name:`맞춤 배치 (방 ${fmt(S.room.w)}×${fmt(S.room.d)}cm)`,pillar:S.pillar,shelf:S.shelf,items,layout:layoutPayload()});
    toast('장바구니에 담았어요. 위쪽 장바구니 버튼에서 주문할 수 있어요.');
  }
  if(e.target.closest('#kakaoBtn')){
    const m=new Map();S.items.forEach(it=>{const k=nameOf(it);m.set(k,(m.get(k)||0)+1)});
    let total=0;S.items.forEach(it=>{total+=PRICE[`${it.type}-${it.w}`]||0});
    const link=location.origin+'/planner?layout='+Shop.encodeLayout(layoutPayload());
    const txt=`[배치 상담 요청]\n방 크기: ${fmt(S.room.w)} × ${fmt(S.room.d)}cm\n프레임: ${PILLAR[S.pillar].name} / 선반: ${SHELF[S.shelf].name}\n구성: ${[...m].map(([k,n])=>`${k} × ${n}`).join(', ')||'-'}\n예상 금액: ${won(total)}\n배치 보기: ${link}`;
    try{await navigator.clipboard.writeText(txt);toast('상담 내용을 복사했어요. 채팅창에 붙여 넣어 주세요.')}catch(err){prompt('아래 내용을 복사해 채팅창에 붙여 넣어 주세요.',txt)}
    window.open(SHOP.kakaoChannelUrl,'_blank','noopener');
  }
});

load();
(function(){const n=S.items.length;S.items=S.items.filter(it=>TYPES[it.type]&&(it.type==='corner'||TYPES[it.type].widths.includes(it.w)));
  if(S.items.length<n)setTimeout(()=>toast(`판매하지 않는 모듈 ${n-S.items.length}개를 저장된 배치에서 뺐어요`),600)})();
const qs=new URLSearchParams(location.search);
if(qs.get('layout')){const L=Shop.decodeLayout(qs.get('layout'));if(applyLayout(L)){sel=null;setTimeout(()=>toast('공유된 배치를 불러왔어요'),300)}}
syncInputs();applyColors();buildRoom();resetCam();size3();refreshAll();
Shop.updateCount();if(window.SHOP&&SHOP.name)$('brand').textContent=SHOP.name;
renderCatalogImages();
(async function(){
  const st=await Shop.loadSettings();
  Object.assign(PRICE,st.prices);
  if(Array.isArray(st.sets)&&st.sets.length)SETS=st.sets.filter(validSet);
  renderSetSel();renderParts();
  const want=qs.get('set');
  if(want){const i=SETS.findIndex(x=>x.k===want);if(i>=0){$('setSel').value=String(i);placeSet(i)}}
})();
})();
</script>
